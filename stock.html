<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DD — Stock Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
:root{--bg:#0a0b0f;--bg2:#0f1117;--card:#161820;--border:#23263a;--text:#e1e4eb;--muted:#7a7f96;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--orange:#f59e0b;--cyan:#06b6d4;--accent:#6366f1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
nav .logo{font-size:20px;font-weight:800}
nav .logo span{color:var(--accent)}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;transition:.15s}
nav a:hover{color:var(--text);background:rgba(99,102,241,.1)}
.container{max-width:1440px;margin:0 auto;padding:24px}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.header h1{font-size:28px;font-weight:800}
.header h1 span{color:var(--accent)}
.ticker-badge{background:var(--accent);color:white;padding:6px 16px;border-radius:8px;font-weight:700;font-size:20px}
.price-block .price{font-size:24px;font-weight:700}
.change{font-size:14px;padding:4px 10px;border-radius:6px;margin-left:8px}
.change.neg{background:rgba(239,68,68,.15);color:var(--red)}
.change.pos{background:rgba(34,197,94,.15);color:var(--green)}
.rating-banner{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}
.r-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center}
.r-card.hl{border-color:var(--accent);box-shadow:0 0 20px rgba(99,102,241,.15)}
.r-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.r-card .value{font-size:26px;font-weight:700}
.r-card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:10px;background:var(--accent);color:white;padding:2px 8px;border-radius:4px}
.kpi{text-align:center}
.kpi .label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.kpi .val{font-size:20px;font-weight:700;margin:4px 0}
.kpi .delta{font-size:12px}
.up{color:var(--green)}.down{color:var(--red)}
.chart-wrap{position:relative;height:280px}
.chart-wrap.tall{height:380px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.argument-list{list-style:none}
.argument-list li{padding:10px 12px;border-left:3px solid;margin-bottom:8px;border-radius:0 6px 6px 0;background:rgba(255,255,255,.02);font-size:13px}
.bull li{border-color:var(--green)}.bear li{border-color:var(--red)}
.argument-list li strong{display:block;margin-bottom:2px}
.thesis-box{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.08));border:1px solid rgba(99,102,241,.3);border-radius:12px;padding:24px;margin-bottom:20px}
.thesis-box h2{font-size:18px;margin-bottom:10px}
.thesis-box p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:10px}
.thesis-box p strong{color:var(--text)}
.positions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pos-card{border-radius:10px;padding:18px;text-align:center}
.pos-card.buy-c{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.pos-card.hold-c{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3)}
.pos-card.strong-buy-c{background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.5)}
.pos-card.short-c{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)}
.pos-card .horizon{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.pos-card .rec{font-size:20px;font-weight:700;margin:6px 0 4px}
.pos-card .detail{font-size:12px;color:var(--muted)}
footer{text-align:center;padding:32px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:1024px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.rating-banner{grid-template-columns:repeat(3,1fr)}.positions{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo"><span>DD</span> Dashboard</a>
  <div>
    <a href="index.html">Overview</a>
    <a href="portfolio.html">Portfolio Simulator</a>
  </div>
</nav>
<div class="container" id="root"></div>
<footer>DD Dashboard — For informational and educational purposes only. Not financial advice. Data as of March 26, 2026.</footer>

<script>
const params = new URLSearchParams(window.location.search);
const ticker = params.get('t') || 'MU';
const S = STOCKS[ticker];
if (!S) { document.getElementById('root').innerHTML = '<h1 style="padding:40px">Stock not found. <a href="index.html" style="color:var(--accent)">Back to dashboard</a></h1>'; throw new Error('not found'); }

document.title = `DD — ${S.ticker} ${S.company}`;
const isShort = S.side === 'Short';
const upside = ((S.target - S.price) / S.price * 100).toFixed(1);
const ratingColor = isShort ? 'var(--red)' : S.rating === 'Strong Buy' ? 'var(--green)' : S.rating === 'Buy' ? 'var(--green)' : 'var(--orange)';

const root = document.getElementById('root');
root.innerHTML = `
<!-- HEADER -->
<div class="header">
  <div style="display:flex;align-items:center;gap:16px">
    <span class="ticker-badge">${S.ticker}</span>
    <div>
      <h1><span>${S.company}</span></h1>
      <div style="color:var(--muted);font-size:13px">${S.exchange}: ${S.ticker} &middot; ${S.sector} &middot; Market Cap: $${S.marketCap}</div>
    </div>
  </div>
  <div class="price-block">
    <span class="price">$${S.price}</span>
    <span class="change ${+upside > 0 ? 'pos' : 'neg'}">${isShort ? 'Target Downside' : 'Target Upside'}: ${upside > 0 ? '+' : ''}${upside}%</span>
  </div>
</div>

<!-- DESCRIPTION -->
<div class="card" style="margin-bottom:20px;font-size:14px;color:var(--muted);line-height:1.7">${S.description}</div>

<!-- RATING BANNER -->
<div class="rating-banner">
  <div class="r-card hl">
    <div class="label">Our Rating</div>
    <div class="value" style="color:${ratingColor}">${S.rating}</div>
    <div class="sub">Conviction: ${S.conviction}/10</div>
  </div>
  <div class="r-card">
    <div class="label">Price Target</div>
    <div class="value" style="color:var(--cyan)">$${S.target}</div>
    <div class="sub">${upside > 0 ? '+' : ''}${upside}% ${isShort ? 'downside' : 'upside'}</div>
  </div>
  <div class="r-card">
    <div class="label">Forward P/E</div>
    <div class="value">${S.fwdPE ? S.fwdPE + 'x' : 'N/A'}</div>
    <div class="sub">${S.peg ? 'PEG: ' + S.peg : ''}</div>
  </div>
  <div class="r-card">
    <div class="label">EV/EBITDA</div>
    <div class="value">${S.evEbitda ? S.evEbitda + 'x' : 'N/A'}</div>
    <div class="sub">${S.fwdEvEbitda ? 'Fwd: ' + S.fwdEvEbitda + 'x' : ''}</div>
  </div>
  <div class="r-card">
    <div class="label">Analyst Consensus</div>
    <div class="value" style="color:var(--green)">${S.analysts.buy}/${S.analysts.hold}/${S.analysts.sell}</div>
    <div class="sub">Buy/Hold/Sell</div>
  </div>
</div>

<!-- CHARTS -->
<div class="grid-2">
  <div class="card">
    <h2>Quarterly Revenue ($B)</h2>
    <div class="chart-wrap"><canvas id="revChart"></canvas></div>
  </div>
  <div class="card">
    <h2>EPS Trajectory</h2>
    <div class="chart-wrap"><canvas id="epsChart"></canvas></div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <h2>Revenue by Segment <span class="tag">Latest FY</span></h2>
    <div class="chart-wrap"><canvas id="segChart"></canvas></div>
  </div>
  <div class="card">
    <h2>Analyst Price Targets</h2>
    <div class="chart-wrap"><canvas id="targetChart"></canvas></div>
  </div>
</div>

${S.quarters.some(q => q.gm) ? `
<div class="grid-2">
  <div class="card">
    <h2>Gross Margin Trend</h2>
    <div class="chart-wrap"><canvas id="gmChart"></canvas></div>
  </div>
  <div class="card">
    <h2>YoY Revenue Growth (%)</h2>
    <div class="chart-wrap"><canvas id="yoyChart"></canvas></div>
  </div>
</div>` : `
<div class="grid-2">
  <div class="card">
    <h2>YoY Revenue Growth (%)</h2>
    <div class="chart-wrap"><canvas id="yoyChart"></canvas></div>
  </div>
  <div class="card">
    <h2>Valuation Metrics</h2>
    <div class="chart-wrap"><canvas id="valChart"></canvas></div>
  </div>
</div>`}

<!-- FINANCIAL TABLE -->
<div class="card" style="margin-bottom:20px">
  <h2>Financial Summary</h2>
  <table>
    <thead><tr><th>Quarter</th><th class="num">Revenue</th><th class="num">EPS</th>${S.quarters.some(q=>q.gm) ? '<th class="num">Gross Margin</th>' : ''}<th class="num">YoY Growth</th></tr></thead>
    <tbody>${S.quarters.map(q => `<tr${q.guided ? ' style="background:rgba(34,197,94,.06)"' : ''}>
      <td>${q.guided ? '<strong>' + q.q + '</strong>' : q.q}</td>
      <td class="num">$${q.rev}B</td>
      <td class="num">${q.eps !== null ? '$' + q.eps : '—'}</td>
      ${S.quarters.some(qq=>qq.gm) ? `<td class="num">${q.gm ? q.gm + '%' : '—'}</td>` : ''}
      <td class="num ${q.yoy > 0 ? 'up' : q.yoy < 0 ? 'down' : ''}">${q.yoy !== null ? (q.yoy > 0 ? '+' : '') + q.yoy + '%' : '—'}</td>
    </tr>`).join('')}</tbody>
  </table>
</div>

<!-- BULL vs BEAR -->
<div class="grid-2">
  <div class="card">
    <h2 style="color:var(--green)">${isShort ? 'Risks to Short' : 'Bull Case'}</h2>
    <ul class="argument-list bull">
      ${(isShort ? [] : S.bull).map(b => `<li><strong>${b.title}</strong>${b.detail}</li>`).join('') || '<li>See bear case — this is a short position</li>'}
    </ul>
  </div>
  <div class="card">
    <h2 style="color:var(--red)">${isShort ? 'Short Thesis' : 'Bear Case'}</h2>
    <ul class="argument-list bear">
      ${S.bear.map(b => `<li><strong>${b.title}</strong>${b.detail}</li>`).join('')}
    </ul>
  </div>
</div>

<!-- THESIS -->
<div class="thesis-box">
  <h2>Investment Thesis</h2>
  <p>${S.thesis}</p>
  <p><strong>Key Catalysts:</strong> ${S.catalysts.join(' | ')}</p>
  <p><strong>Key Risks:</strong> ${S.risks_detail}</p>
</div>

<!-- SCENARIO ANALYSIS -->
<div class="card" style="margin-bottom:20px">
  <h2>Scenario Analysis</h2>
  <table>
    <thead><tr><th>Scenario</th><th class="num">EPS</th><th class="num">Multiple</th><th class="num">Implied Price</th><th class="num">Return from $${S.price}</th></tr></thead>
    <tbody>${S.scenarios.map(s => {
      const ret = ((s.price - S.price) / S.price * 100).toFixed(0);
      return `<tr${s.highlight ? ' style="background:rgba(99,102,241,.08);font-weight:600"' : ''}>
        <td>${s.name}</td>
        <td class="num">${s.eps !== null ? '$' + s.eps : '—'}</td>
        <td class="num">${s.multiple !== null ? s.multiple + 'x' : '—'}</td>
        <td class="num" style="color:${+ret > 0 ? 'var(--green)' : 'var(--red)'}">$${s.price}</td>
        <td class="num" style="color:${+ret > 0 ? 'var(--green)' : 'var(--red)'}">${+ret > 0 ? '+' : ''}${ret}%</td>
      </tr>`;
    }).join('')}</tbody>
  </table>
</div>

<!-- POSITION RECS -->
<div class="card" style="margin-bottom:20px">
  <h2>Position Recommendations</h2>
  <div class="positions">
    ${isShort ? `
    <div class="pos-card short-c"><div class="horizon">Very Short (1-4 wks)</div><div class="rec" style="color:var(--orange)">WATCH</div><div class="detail">Wait for technical bounce to fade before initiating. Don't short into panic selling.</div></div>
    <div class="pos-card short-c"><div class="horizon">Short (1-6 mo)</div><div class="rec" style="color:var(--red)">SHORT</div><div class="detail">Initiate short on rallies. Use options for defined risk. Target: $${S.target}.</div></div>
    <div class="pos-card short-c"><div class="horizon">Long Term (6-18 mo)</div><div class="rec" style="color:var(--red)">SHORT</div><div class="detail">Fundamental overvaluation should resolve. Manage position size carefully. Cover below target.</div></div>
    ` : `
    <div class="pos-card hold-c"><div class="horizon">Very Short (1-4 wks)</div><div class="rec" style="color:var(--orange)">ACCUMULATE</div><div class="detail">Use weakness to build position. Layer in gradually. Don't chase bounces.</div></div>
    <div class="pos-card buy-c"><div class="horizon">Short (1-6 mo)</div><div class="rec" style="color:var(--green)">BUY</div><div class="detail">Next earnings should reinforce the thesis. Post-earnings drift typically resolves within 60 days.</div></div>
    <div class="pos-card strong-buy-c"><div class="horizon">Long Term (6-18 mo)</div><div class="rec" style="color:var(--green)">${S.conviction >= 8 ? 'STRONG BUY' : 'BUY'}</div><div class="detail">Target: $${S.target} (${upside > 0 ? '+' : ''}${upside}%). Begin tightening stops if thesis deteriorates.</div></div>
    `}
  </div>
</div>
`;

// CHARTS
const C = {green:'#22c55e',red:'#ef4444',blue:'#3b82f6',purple:'#a855f7',orange:'#f59e0b',cyan:'#06b6d4',accent:'#6366f1',muted:'#7a7f96',text:'#e1e4eb',grid:'rgba(35,38,58,.6)'};
const dOpts = {responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:C.text,font:{size:11}}},tooltip:{backgroundColor:'#161820',borderColor:'#23263a',borderWidth:1,titleColor:C.text,bodyColor:C.muted,padding:12,cornerRadius:8}},scales:{x:{ticks:{color:C.muted},grid:{color:C.grid}},y:{ticks:{color:C.muted},grid:{color:C.grid}}}};

// Revenue
new Chart(document.getElementById('revChart'),{type:'bar',data:{labels:S.quarters.map(q=>q.q),datasets:[{label:'Revenue ($B)',data:S.quarters.map(q=>q.rev),backgroundColor:S.quarters.map(q=>q.guided?C.green:C.accent),borderRadius:6}]},options:{...dOpts,plugins:{...dOpts.plugins,legend:{display:false}},scales:{...dOpts.scales,y:{...dOpts.scales.y,ticks:{...dOpts.scales.y.ticks,callback:v=>'$'+v+'B'}}}}});

// EPS
const epsData = S.quarters.filter(q => q.eps !== null);
new Chart(document.getElementById('epsChart'),{type:'bar',data:{labels:epsData.map(q=>q.q),datasets:[{label:'EPS',data:epsData.map(q=>q.eps),backgroundColor:epsData.map(q=>q.eps >= 0 ? (q.guided?C.green:C.purple) : C.red),borderRadius:6}]},options:{...dOpts,plugins:{...dOpts.plugins,legend:{display:false}},scales:{...dOpts.scales,y:{...dOpts.scales.y,ticks:{...dOpts.scales.y.ticks,callback:v=>'$'+v}}}}});

// Segments
new Chart(document.getElementById('segChart'),{type:'doughnut',data:{labels:S.segments.map(s=>s.name),datasets:[{data:S.segments.map(s=>s.value),backgroundColor:S.segments.map(s=>s.color),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:C.text,font:{size:12},padding:14}},tooltip:{callbacks:{label:ctx=>ctx.label+': $'+ctx.parsed+'B'}}}}});

// Analyst Targets
new Chart(document.getElementById('targetChart'),{type:'bar',data:{labels:['Low Target','Current Price','Our Target','Avg Analyst','High Target'],datasets:[{data:[S.analysts.lowTarget,S.price,S.target,S.analysts.avgTarget,S.analysts.highTarget],backgroundColor:[C.red,C.muted,C.accent,C.blue,C.green],borderRadius:6}]},options:{...dOpts,indexAxis:'y',plugins:{...dOpts.plugins,legend:{display:false}},scales:{x:{ticks:{color:C.muted,callback:v=>'$'+v},grid:{color:C.grid}},y:{ticks:{color:C.text,font:{size:12,weight:'bold'}},grid:{color:C.grid}}}}});

// Gross Margin (if available)
if (S.quarters.some(q => q.gm) && document.getElementById('gmChart')) {
  const gmData = S.quarters.filter(q => q.gm !== null);
  new Chart(document.getElementById('gmChart'),{type:'line',data:{labels:gmData.map(q=>q.q),datasets:[{label:'Gross Margin %',data:gmData.map(q=>q.gm),borderColor:C.green,backgroundColor:'rgba(34,197,94,.1)',fill:true,tension:.4,pointRadius:5,pointBackgroundColor:C.green}]},options:{...dOpts,scales:{...dOpts.scales,y:{...dOpts.scales.y,ticks:{...dOpts.scales.y.ticks,callback:v=>v+'%'}}}}});
}

// YoY Growth
const yoyData = S.quarters.filter(q => q.yoy !== null);
new Chart(document.getElementById('yoyChart'),{type:'bar',data:{labels:yoyData.map(q=>q.q),datasets:[{label:'YoY Growth %',data:yoyData.map(q=>q.yoy),backgroundColor:yoyData.map(q=>q.yoy >= 0 ? C.green : C.red),borderRadius:6}]},options:{...dOpts,plugins:{...dOpts.plugins,legend:{display:false}},scales:{...dOpts.scales,y:{...dOpts.scales.y,ticks:{...dOpts.scales.y.ticks,callback:v=>v+'%'}}}}});

// Valuation (if no gross margin chart)
if (!S.quarters.some(q => q.gm) && document.getElementById('valChart')) {
  const vals = [
    {label:'Trailing P/E', val:S.trailingPE},
    {label:'Forward P/E', val:S.fwdPE},
    {label:'EV/EBITDA', val:S.evEbitda},
    {label:'Fwd EV/EBITDA', val:S.fwdEvEbitda}
  ].filter(v => v.val);
  new Chart(document.getElementById('valChart'),{type:'bar',data:{labels:vals.map(v=>v.label),datasets:[{data:vals.map(v=>v.val),backgroundColor:C.accent,borderRadius:6}]},options:{...dOpts,plugins:{...dOpts.plugins,legend:{display:false}},scales:{...dOpts.scales,y:{...dOpts.scales.y,ticks:{...dOpts.scales.y.ticks,callback:v=>v+'x'}}}}});
}
</script>
</body>
</html>
